<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<link rel="icon" type="image/x-icon" href="/assets/logo/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/logo/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/assets/logo/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/logo/apple-touch-icon.png" />
<title>Uruskan Tempahan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css?v=10" />
<script>
  (function () {
    var saved = localStorage.getItem("eqstudio_theme");
    if (saved === "dark") document.documentElement.setAttribute("data-theme", "dark");
  })();
</script>
</head>
<body>
  <div class="wrap-narrow" style="padding-top:2.5rem;">
    <div id="manage-content">
      <div class="sim-spinner-wrap"><div class="sim-spinner"></div><p class="hint">Memuatkan...</p></div>
    </div>
  </div>

  <script type="module">
    const token = new URLSearchParams(window.location.search).get("token");
    let data = null;
    let mode = "view"; // view | reschedule
    let selectedDate = null;
    let selectedSlot = null;

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }
    function dateLabel(dateKey) {
      const d = new Date(dateKey + "T00:00:00");
      return d.toLocaleDateString("ms-MY", { weekday: "short", day: "numeric", month: "short" });
    }

    async function load() {
      const content = document.getElementById("manage-content");
      if (!token) {
        content.innerHTML = `<div class="card"><p class="error">Link tidak lengkap.</p></div>`;
        return;
      }
      try {
        const res = await fetch(`/api/booking-customer-manage?token=${encodeURIComponent(token)}&days=21`);
        data = await res.json();
        if (!res.ok) {
          content.innerHTML = `<div class="card"><p class="error">${escapeHtml(data.error || "Tempahan tidak dijumpai.")}</p></div>`;
          return;
        }
        render();
      } catch {
        content.innerHTML = `<div class="card"><p class="error">Gagal memuatkan. Cuba refresh.</p></div>`;
      }
    }

    function render() {
      const content = document.getElementById("manage-content");
      const biz = data.business;
      const b = data.booking;

      const header = `
        <div style="text-align:center; margin-bottom:1.5rem;">
          ${biz.logo_url ? `<img src="${escapeHtml(biz.logo_url)}" style="max-height:56px; margin-bottom:0.8rem;" />` : `<p class="brand" style="font-size:1.3rem;">${escapeHtml(biz.name || "")}</p>`}
        </div>`;

      if (b.status === "cancelled") {
        content.innerHTML = header + `<div class="card"><p style="text-align:center;">Tempahan ni telah dibatalkan.</p></div>`;
        return;
      }

      if (mode === "view") {
        content.innerHTML = header + `
          <div class="card">
            <p class="hint" style="text-transform:uppercase; font-size:0.7rem;">Tempahan Semasa</p>
            <p style="font-size:1.05rem; font-weight:600; margin:0.2rem 0 1.2rem;">${escapeHtml(b.current_slot_label)}</p>
            <div class="row">
              <button type="button" id="btn-reschedule" style="flex:1;">Reschedule</button>
              <button type="button" class="secondary" id="btn-cancel" style="flex:1; color:var(--warn);">Batal Tempahan</button>
            </div>
          </div>
        `;
        document.getElementById("btn-reschedule").addEventListener("click", () => { mode = "reschedule"; render(); });
        document.getElementById("btn-cancel").addEventListener("click", renderCancelConfirm);
        return;
      }

      if (mode === "reschedule") {
        const dateKeys = Object.keys(data.slots_by_date);
        if (!selectedDate) selectedDate = dateKeys[0];
        if (dateKeys.length === 0) {
          content.innerHTML = header + `<div class="card"><p class="hint">Tiada slot lain available buat masa ni. Sila hubungi terus.</p></div>`;
          return;
        }
        content.innerHTML = header + `
          <div class="card">
            <p class="hint" style="text-transform:uppercase; font-size:0.7rem;">Tempahan Semasa</p>
            <p style="font-size:0.92rem; text-decoration:line-through; color:var(--ink-soft); margin:0.2rem 0 1rem;">${escapeHtml(b.current_slot_label)}</p>
            <p class="hint">Pilih slot baru:</p>
            <div class="book-date-row" id="mng-date-row"></div>
            <div class="book-slot-grid" id="mng-slot-grid" style="margin-top:1rem;"></div>
            <p class="error" id="mng-error" style="display:none; margin-top:0.8rem;"></p>
            <button type="button" class="secondary" id="btn-back" style="width:100%; margin-top:1rem;">← Kembali</button>
          </div>
        `;
        const dateRow = document.getElementById("mng-date-row");
        dateRow.innerHTML = dateKeys.map(k => `<button type="button" class="chip book-date-chip ${k === selectedDate ? "selected" : ""}" data-date="${k}">${dateLabel(k)}</button>`).join("");
        dateRow.querySelectorAll(".book-date-chip").forEach(btn => {
          btn.addEventListener("click", () => { selectedDate = btn.dataset.date; selectedSlot = null; render(); });
        });
        const slots = data.slots_by_date[selectedDate] || [];
        const slotGrid = document.getElementById("mng-slot-grid");
        slotGrid.innerHTML = slots.map(s => `<button type="button" class="chip book-slot-chip" data-iso="${s.iso}">${s.label}</button>`).join("");
        slotGrid.querySelectorAll("[data-iso]").forEach(btn => {
          btn.addEventListener("click", () => confirmReschedule(btn.dataset.iso, btn.textContent));
        });
        document.getElementById("btn-back").addEventListener("click", () => { mode = "view"; render(); });
      }
    }

    async function confirmReschedule(iso, label) {
      const errEl = document.getElementById("mng-error");
      errEl.style.display = "none";
      try {
        const res = await fetch("/api/booking-customer-action", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, action: "reschedule", new_slot_iso: iso }),
        });
        const result = await res.json();
        if (!res.ok) throw new Error(result.error || "Gagal reschedule.");
        document.getElementById("manage-content").innerHTML = `
          <div class="card" style="text-align:center;">
            <div style="font-size:2.2rem; margin-bottom:0.5rem;">✅</div>
            <h2 style="margin-top:0;">Tempahan Ditukar!</h2>
            <p class="hint">${escapeHtml(result.new_slot_label)}</p>
          </div>`;
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = "block";
      }
    }

    function renderCancelConfirm() {
      const content = document.getElementById("manage-content");
      content.innerHTML += `
        <div class="card" style="margin-top:1rem;">
          <p style="font-weight:600;">Pasti nak batalkan tempahan ni?</p>
          <label for="cancel-reason">Sebab (optional)</label>
          <textarea id="cancel-reason" rows="2"></textarea>
          <div class="row" style="margin-top:1rem;">
            <button type="button" class="secondary" id="cancel-back" style="flex:1;">Tak Jadi</button>
            <button type="button" id="cancel-confirm" style="flex:1; background:var(--warn);">Ya, Batalkan</button>
          </div>
        </div>
      `;
      document.getElementById("cancel-back").addEventListener("click", render);
      document.getElementById("cancel-confirm").addEventListener("click", async () => {
        const reason = document.getElementById("cancel-reason").value;
        const res = await fetch("/api/booking-customer-action", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, action: "cancel", reason }),
        });
        const result = await res.json();
        if (!res.ok) { alert(result.error); return; }
        document.getElementById("manage-content").innerHTML = `<div class="card" style="text-align:center;"><p>Tempahan telah dibatalkan.</p></div>`;
      });
    }

    load();
  </script>
</body>
</html>
