<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<link rel="icon" type="image/x-icon" href="/assets/logo/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/logo/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/assets/logo/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/logo/apple-touch-icon.png" />
<title>Buat Tempahan</title>
<meta name="description" content="Book slot senang, terus dari sini — tiada perlu WhatsApp/call untuk confirm tarikh." />
<meta property="og:type" content="website" />
<meta property="og:title" content="Buat Tempahan — eqstudio.link" />
<meta property="og:description" content="Book slot senang, terus dari sini — tiada perlu WhatsApp/call untuk confirm tarikh." />
<meta property="og:image" content="https://eqstudio.link/assets/og-image.png" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css?v=7" />
<script>
  (function () {
    var saved = localStorage.getItem("eqstudio_theme");
    if (saved === "dark") document.documentElement.setAttribute("data-theme", "dark");
  })();
</script>
</head>
<body>
  <div class="wrap-narrow" style="padding-top:2.5rem;">
    <div id="book-content">
      <div class="sim-spinner-wrap"><img src="/assets/logo/logo-64.png" class="logo-loader" alt="" /><p class="hint">Memuatkan...</p></div>
    </div>
  </div>

  <div class="modal-overlay" id="service-detail-modal" style="display:none;">
    <div class="modal-box" style="max-width:420px;">
      <img id="service-detail-poster" style="width:100%; border-radius:10px; margin-bottom:0.8rem; display:none;" alt="" />
      <h2 id="service-detail-title" style="margin:0 0 0.5rem;"></h2>
      <p class="hint" id="service-detail-description" style="white-space:pre-wrap;"></p>
      <button type="button" class="secondary" id="service-detail-close-btn" style="width:100%; margin-top:1rem;">Tutup</button>
    </div>
  </div>

  <script type="module">
    const slug = new URLSearchParams(window.location.search).get("slug");
    let availabilityData = null;
    let selectedType = null;
    let selectedDate = null;
    let selectedSlot = null;
    let lastFormValues = { name: "", email: "", phone: "" };
    let lang = localStorage.getItem("eqstudio_booking_lang") || "ms";

    // Note: zh/ta are AI-generated translations — a native speaker should review before go-live.
    const UI = {
      ms: { yourBooking: "Tempahan Anda", deposit: "Deposit", stepDetails: "Butiran", loading: "Memuatkan...", incomplete: "Link booking tidak lengkap.", notFound: "Link booking tidak dijumpai.", loadFail: "Gagal memuatkan. Cuba refresh.", noSlots: "Tiada slot available buat masa ni. Sila hubungi terus.", pickSlot: "Pilih tarikh & slot yang sesuai", pickType: "Pilih jenis perkhidmatan", slotChosen: "Slot dipilih", free: "Percuma", name: "Nama", email: "Emel", emailPlaceholder: "untuk terima confirmation & reminder deposit", phone: "Nombor Telefon (optional)", notes: "Catatan (optional)", confirmBtn: "Sahkan Tempahan", sending: "Menghantar...", confirmed: "Tempahan Disahkan!", confirmedNote: "Kami dah hantar confirmation ke emel anda. Reminder deposit akan menyusul sekejap lagi.", bookAgain: "+ Book Sesi Lagi", genericError: "Gagal buat tempahan.", changeType: "← Tukar Jenis Perkhidmatan", viewMore: "Lihat Lagi" },
      en: { yourBooking: "Your Booking", deposit: "Deposit", stepDetails: "Details", loading: "Loading...", incomplete: "Incomplete booking link.", notFound: "Booking link not found.", loadFail: "Failed to load. Try refreshing.", noSlots: "No slots available right now. Please contact directly.", pickSlot: "Pick a date & time that suits you", pickType: "Choose a service", slotChosen: "Selected slot", free: "Free", name: "Name", email: "Email", emailPlaceholder: "to receive confirmation & deposit reminder", phone: "Phone Number (optional)", notes: "Notes (optional)", confirmBtn: "Confirm Booking", sending: "Sending...", confirmed: "Booking Confirmed!", confirmedNote: "We've sent a confirmation to your email. A deposit reminder will follow shortly.", bookAgain: "+ Book Another Session", genericError: "Failed to book.", changeType: "← Change Service", viewMore: "Learn More" },
      zh: { yourBooking: "您的预订", deposit: "押金", stepDetails: "详情", loading: "加载中...", incomplete: "预订链接不完整。", notFound: "找不到预订链接。", loadFail: "加载失败，请重试。", noSlots: "目前没有可用的时段，请直接联系。", pickSlot: "选择合适的日期和时间", pickType: "选择服务类型", slotChosen: "已选时段", free: "免费", name: "姓名", email: "电子邮件", emailPlaceholder: "用于接收确认和押金提醒", phone: "电话号码（可选）", notes: "备注（可选）", confirmBtn: "确认预订", sending: "发送中...", confirmed: "预订已确认！", confirmedNote: "我们已将确认发送到您的电子邮件。押金提醒将很快发送。", bookAgain: "+ 预订另一场", genericError: "预订失败。", changeType: "← 更改服务类型", viewMore: "了解更多" },
      ta: { yourBooking: "உங்கள் முன்பதிவு", deposit: "வைப்புத்தொகை", stepDetails: "விவரங்கள்", loading: "ஏற்றுகிறது...", incomplete: "முழுமையற்ற முன்பதிவு இணைப்பு.", notFound: "முன்பதிவு இணைப்பு கிடைக்கவில்லை.", loadFail: "ஏற்ற முடியவில்லை. மீண்டும் முயற்சிக்கவும்.", noSlots: "தற்போது இடங்கள் இல்லை. நேரடியாக தொடர்பு கொள்ளவும்.", pickSlot: "பொருத்தமான தேதி & நேரத்தைத் தேர்ந்தெடுக்கவும்", pickType: "சேவை வகையைத் தேர்ந்தெடுக்கவும்", slotChosen: "தேர்ந்தெடுக்கப்பட்ட நேரம்", free: "இலவசம்", name: "பெயர்", email: "மின்னஞ்சல்", emailPlaceholder: "உறுதிப்படுத்தல் & வைப்புத்தொகை நினைவூட்டலைப் பெற", phone: "தொலைபேசி எண் (விருப்பம்)", notes: "குறிப்புகள் (விருப்பம்)", confirmBtn: "முன்பதிவை உறுதிப்படுத்தவும்", sending: "அனுப்புகிறது...", confirmed: "முன்பதிவு உறுதி செய்யப்பட்டது!", confirmedNote: "உங்கள் மின்னஞ்சலுக்கு உறுதிப்படுத்தல் அனுப்பப்பட்டது. வைப்புத்தொகை நினைவூட்டல் விரைவில் வரும்.", bookAgain: "+ மற்றொரு அமர்வை முன்பதிவு செய்யவும்", genericError: "முன்பதிவு தோல்வியடைந்தது.", changeType: "← சேவை வகையை மாற்றவும்", viewMore: "மேலும் அறிக" },
    };
    const LANG_LABELS = { ms: "BM", en: "EN", zh: "中文", ta: "தமிழ்" };
    function T() { return UI[lang] || UI.ms; }

    function renderLangSwitcher() {
      return `
        <div class="lang-switcher" id="lang-switcher">
          ${Object.keys(LANG_LABELS).map(code => `<button type="button" class="lang-chip ${code === lang ? "selected" : ""}" data-lang="${code}">${LANG_LABELS[code]}</button>`).join("")}
        </div>`;
    }
    function wireLangSwitcher() {
      document.querySelectorAll(".lang-chip").forEach(btn => {
        btn.addEventListener("click", () => {
          lang = btn.dataset.lang;
          localStorage.setItem("eqstudio_booking_lang", lang);
          renderCurrentStep();
        });
      });
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    function dateLabel(dateKey) {
      const d = new Date(dateKey + "T00:00:00");
      const localeMap = { ms: "ms-MY", en: "en-MY", zh: "zh-CN", ta: "ta-IN" };
      return d.toLocaleDateString(localeMap[lang] || "ms-MY", { weekday: "short", day: "numeric", month: "short" });
    }

    function renderCurrentStep() {
      if (!availabilityData) return;
      if (availabilityData.slots_by_date === null) {
        const types = availabilityData.event_types || [];
        if (types.length === 1) {
          selectedType = types[0];
          loadAvailability(types[0].id);
          return;
        }
        renderTypePicker();
      }
      else renderPicker();
    }

    async function loadAvailability(typeId) {
      const content = document.getElementById("book-content");
      if (!slug) {
        content.innerHTML = renderLangSwitcher() + `<div class="card"><p class="error">${T().incomplete}</p></div>`;
        wireLangSwitcher();
        return;
      }
      content.innerHTML = renderLangSwitcher() + `<div class="sim-spinner-wrap"><div class="sim-spinner"></div><p class="hint">${T().loading}</p></div>`;
      wireLangSwitcher();
      try {
        const typeParam = typeId ? `&type=${encodeURIComponent(typeId)}` : "";
        const res = await fetch(`/api/booking-availability?slug=${encodeURIComponent(slug)}&days=21${typeParam}`);
        const data = await res.json();
        if (!res.ok) {
          content.innerHTML = renderLangSwitcher() + `<div class="card"><p class="error">${escapeHtml(data.error || T().notFound)}</p></div>`;
          wireLangSwitcher();
          return;
        }
        availabilityData = data;
        renderCurrentStep();
      } catch (err) {
        content.innerHTML = renderLangSwitcher() + `<div class="card"><p class="error">${T().loadFail}</p></div>`;
        wireLangSwitcher();
      }
    }

    function renderBizHeader() {
      const biz = availabilityData.business;
      return `
        <div class="book-biz-banner">
          ${biz.logo_url ? `<img src="${escapeHtml(biz.logo_url)}" />` : `<p class="brand" style="font-size:1.3rem; margin:0;">${escapeHtml(biz.name)}</p>`}
        </div>`;
    }

    function currentDeposit() {
      return selectedType
        ? (selectedType.deposit_amount != null ? selectedType.deposit_amount : availabilityData?.deposit_amount)
        : availabilityData?.deposit_amount;
    }

    function renderStepIndicator(step) {
      const hasTypeStep = (availabilityData.event_types || []).length > 0;
      const steps = hasTypeStep
        ? [{ n: 1, label: T().pickType }, { n: 2, label: T().pickSlot }, { n: 3, label: T().stepDetails }]
        : [{ n: 2, label: T().pickSlot }, { n: 3, label: T().stepDetails }];
      return `
        <div class="book-steps">
          ${steps.map((s, i) => `
            <div class="book-step ${step > s.n ? "done" : step === s.n ? "active" : ""}">
              <span class="book-step-dot">${step > s.n ? "✓" : (hasTypeStep ? s.n : i + 1)}</span>
            </div>
            ${i < steps.length - 1 ? `<span class="book-step-line ${step > s.n ? "done" : ""}"></span>` : ""}
          `).join("")}
        </div>`;
    }

    function renderSummaryCard() {
      const noTypesToPick = (availabilityData.event_types || []).length === 0;
      if (!selectedType && !selectedDate && !noTypesToPick) return "";
      const deposit = currentDeposit();
      const depositLabel = deposit === 0 ? T().free : (deposit != null ? `RM ${Number(deposit).toFixed(2)}` : "");
      const rows = [];
      if (selectedType) rows.push(`<div class="book-summary-row"><span class="book-summary-label">${T().pickType}</span><span class="book-summary-value">${escapeHtml(selectedType.name)}</span></div>`);
      if (selectedDate && selectedSlot) rows.push(`<div class="book-summary-row"><span class="book-summary-label">${T().slotChosen}</span><span class="book-summary-value">${dateLabel(selectedDate)}, ${selectedSlot.label}</span></div>`);
      if (depositLabel && (selectedType || noTypesToPick)) {
        rows.push(`<div class="book-summary-row"><span class="book-summary-label">${T().deposit}</span><span class="book-summary-value deposit">${depositLabel}</span></div>`);
      }
      if (rows.length === 0) return "";
      return `<div class="book-summary-card">${rows.join("")}</div>`;
    }

    function renderTypePicker() {
      const content = document.getElementById("book-content");
      const types = availabilityData.event_types || [];
      content.innerHTML = renderLangSwitcher() + renderBizHeader() + renderStepIndicator(1) + `
        <p class="hint" style="text-align:center; margin-bottom:1rem;">${T().pickType}</p>
        <div class="card">
          ${types.map(t => `
            <div class="event-type-row" data-select-type="${t.id}">
              ${t.poster_url ? `<img src="${escapeHtml(t.poster_url)}" class="event-type-thumb" alt="" />` : ""}
              <div style="flex:1; min-width:0;">
                <strong>${escapeHtml(t.name)}</strong>
                <div class="hint" style="font-size:0.8rem;">${t.duration_minutes} minit${t.capacity > 1 ? ` · sehingga ${t.capacity} orang` : ""}</div>
                ${(t.description || t.poster_url) ? `<button type="button" class="event-type-viewmore" data-viewmore-id="${t.id}">${T().viewMore}</button>` : ""}
              </div>
              <span class="mono" style="font-weight:600; color:var(--stamp); white-space:nowrap;">${t.deposit_amount === 0 ? T().free : (t.deposit_amount != null ? `RM ${Number(t.deposit_amount).toFixed(2)}` : "")}</span>
            </div>
          `).join("")}
        </div>
      `;
      wireLangSwitcher();
      document.querySelectorAll("[data-select-type]").forEach(row => {
        row.addEventListener("click", (e) => {
          if (e.target.closest(".event-type-viewmore")) return;
          const t = types.find(t => t.id === row.dataset.selectType);
          selectedType = t;
          selectedDate = null;
          selectedSlot = null;
          calendarViewMonth = null;
          loadAvailability(t.id);
        });
      });
      document.querySelectorAll(".event-type-viewmore").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const t = types.find(t => t.id === btn.dataset.viewmoreId);
          openServiceDetailModal(t);
        });
      });
    }

    function openServiceDetailModal(t) {
      document.getElementById("service-detail-title").textContent = t.name;
      document.getElementById("service-detail-poster").style.display = t.poster_url ? "block" : "none";
      document.getElementById("service-detail-poster").src = t.poster_url || "";
      document.getElementById("service-detail-description").textContent = t.description || "";
      document.getElementById("service-detail-modal").style.display = "flex";
    }
    document.getElementById("service-detail-close-btn")?.addEventListener("click", () => {
      document.getElementById("service-detail-modal").style.display = "none";
    });

    let calendarViewMonth = null; // "YYYY-MM" string, tracks which month is shown

    function renderDateCalendar(dateKeys) {
      if (dateKeys.length === 0) return;
      if (!calendarViewMonth) calendarViewMonth = (selectedDate || dateKeys[0]).slice(0, 7);

      const slotsByDate = availabilityData.slots_by_date;
      const [viewYear, viewMonthNum] = calendarViewMonth.split("-").map(Number);
      const firstOfMonth = new Date(viewYear, viewMonthNum - 1, 1);
      const daysInMonth = new Date(viewYear, viewMonthNum, 0).getDate();
      const startWeekday = firstOfMonth.getDay(); // 0=Sun

      const minMonth = dateKeys[0].slice(0, 7);
      const maxMonth = dateKeys[dateKeys.length - 1].slice(0, 7);
      const canGoPrev = calendarViewMonth > minMonth;
      const canGoNext = calendarViewMonth < maxMonth;

      const weekdayLabels = lang === "ms" ? ["A", "I", "S", "R", "K", "J", "S"] : ["S", "M", "T", "W", "T", "F", "S"];
      const monthLabel = firstOfMonth.toLocaleDateString(lang === "ms" ? "ms-MY" : "en-MY", { month: "long", year: "numeric" });

      let cells = "";
      for (let i = 0; i < startWeekday; i++) cells += `<div class="book-cal-day empty"></div>`;
      for (let d = 1; d <= daysInMonth; d++) {
        const key = `${viewYear}-${String(viewMonthNum).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const slots = slotsByDate[key];
        const count = slots ? slots.length : 0;
        const density = count === 0 ? "" : count <= 2 ? "density-low" : count <= 5 ? "density-med" : "density-high";
        const isSelected = key === selectedDate;
        cells += `<div class="book-cal-day ${count > 0 ? "has-slots " + density : ""} ${isSelected ? "selected" : ""}" ${count > 0 ? `data-date-cell="${key}"` : ""}>
          <span>${d}</span>${count > 0 ? '<span class="dot"></span>' : ""}
        </div>`;
      }

      document.getElementById("book-date-row").innerHTML = `
        <div class="book-cal-header">
          <button type="button" class="book-cal-nav-btn" id="cal-prev-btn" ${!canGoPrev ? "disabled" : ""}>‹</button>
          <span class="book-cal-month-label">${monthLabel}</span>
          <button type="button" class="book-cal-nav-btn" id="cal-next-btn" ${!canGoNext ? "disabled" : ""}>›</button>
        </div>
        <div class="book-cal-weekdays">${weekdayLabels.map(w => `<span>${w}</span>`).join("")}</div>
        <div class="book-cal-grid">${cells}</div>
      `;

      document.getElementById("cal-prev-btn")?.addEventListener("click", () => {
        const d = new Date(viewYear, viewMonthNum - 2, 1);
        calendarViewMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
        renderDateCalendar(dateKeys);
      });
      document.getElementById("cal-next-btn")?.addEventListener("click", () => {
        const d = new Date(viewYear, viewMonthNum, 1);
        calendarViewMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
        renderDateCalendar(dateKeys);
      });
      document.querySelectorAll("[data-date-cell]").forEach(cell => {
        cell.addEventListener("click", () => {
          selectedDate = cell.dataset.dateCell;
          selectedSlot = null;
          renderPicker();
        });
      });
    }

    function renderPicker() {
      const content = document.getElementById("book-content");
      const dateKeys = Object.keys(availabilityData.slots_by_date);
      const hasTypes = (availabilityData.event_types || []).length > 0;

      if (dateKeys.length === 0) {
        content.innerHTML = renderLangSwitcher() + renderBizHeader() +
          `<div class="card"><p class="hint" style="text-align:center;">${T().noSlots}</p></div>`;
        wireLangSwitcher();
        return;
      }

      if (!selectedDate) selectedDate = dateKeys[0];

      content.innerHTML = renderLangSwitcher() + renderBizHeader() + renderStepIndicator(selectedSlot ? 3 : 2) + renderSummaryCard() + `
        ${hasTypes ? `<button type="button" class="secondary" id="change-type-btn" style="margin-bottom:0.8rem;">${T().changeType}</button>` : ""}
        ${!hasTypes && (availabilityData.link_description || availabilityData.link_poster_url) ? `<button type="button" class="event-type-viewmore" id="link-viewmore-btn" style="margin-bottom:0.8rem; display:block;">${T().viewMore}</button>` : ""}
        <p class="hint" style="margin-bottom:0.8rem;">${T().pickSlot}</p>
        <div class="card">
          <div class="book-date-row" id="book-date-row"></div>
          <div class="book-slot-grid" id="book-slot-grid" style="margin-top:1rem;"></div>
        </div>
        <div id="book-form-wrap"></div>
      `;
      document.getElementById("link-viewmore-btn")?.addEventListener("click", () => {
        openServiceDetailModal({ name: availabilityData.business.name, description: availabilityData.link_description, poster_url: availabilityData.link_poster_url });
      });
      wireLangSwitcher();

      document.getElementById("change-type-btn")?.addEventListener("click", () => {
        selectedType = null;
        availabilityData.slots_by_date = null;
        renderTypePicker();
      });

      renderDateCalendar(dateKeys);

      const slotGrid = document.getElementById("book-slot-grid");
      const slots = availabilityData.slots_by_date[selectedDate] || [];
      slotGrid.innerHTML = slots.map(s => `
        <button type="button" class="chip book-slot-chip ${selectedSlot?.iso === s.iso ? "selected" : ""}" data-iso="${s.iso}">${s.label}</button>
      `).join("");
      slotGrid.querySelectorAll(".book-slot-chip").forEach(btn => {
        btn.addEventListener("click", () => {
          selectedSlot = slots.find(s => s.iso === btn.dataset.iso);
          renderPicker();
          renderForm();
        });
      });

      if (selectedSlot) renderForm();
    }

    function renderForm() {
      const wrap = document.getElementById("book-form-wrap");
      const customQuestions = availabilityData.questions || [];
      const deposit = currentDeposit();
      const depositLabel = deposit === 0 ? T().free : (deposit != null ? `RM ${Number(deposit).toFixed(2)}` : "");

      wrap.innerHTML = `
        <div class="card" style="margin-top:0.8rem;">
          <form id="book-form">
            <label for="bk-name">${T().name}</label>
            <input type="text" id="bk-name" required value="${escapeHtml(lastFormValues.name)}" />
            <label for="bk-email">${T().email}</label>
            <input type="email" id="bk-email" required placeholder="${T().emailPlaceholder}" value="${escapeHtml(lastFormValues.email)}" />
            <label for="bk-phone">${T().phone}</label>
            <input type="text" id="bk-phone" value="${escapeHtml(lastFormValues.phone)}" />
            <label for="bk-notes">${T().notes}</label>
            <textarea id="bk-notes" rows="2"></textarea>
            ${customQuestions.map((q, i) => `
              <label for="bk-custom-${i}">${escapeHtml(q.question_text)}</label>
              <input type="text" id="bk-custom-${i}" data-question="${escapeHtml(q.question_text)}" />
            `).join("")}
            <button type="submit" style="width:100%; margin-top:1.25rem;">${depositLabel ? `${T().confirmBtn} · ${depositLabel}` : T().confirmBtn}</button>
            <p class="error" id="book-error" style="display:none;"></p>
          </form>
        </div>
      `;

      document.getElementById("book-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector("button[type=submit]");
        btn.disabled = true;
        btn.textContent = T().sending;

        const customAnswers = {};
        customQuestions.forEach((q, i) => {
          const val = document.getElementById(`bk-custom-${i}`).value.trim();
          if (val) customAnswers[q.question_text] = val;
        });

        lastFormValues = {
          name: document.getElementById("bk-name").value,
          email: document.getElementById("bk-email").value,
          phone: document.getElementById("bk-phone").value,
        };

        try {
          const res = await fetch("/api/booking-create", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              slug,
              slot_iso: selectedSlot.iso,
              event_type_id: selectedType ? selectedType.id : undefined,
              duration_minutes: availabilityData.slot_duration_minutes,
              name: lastFormValues.name,
              email: lastFormValues.email,
              phone: lastFormValues.phone,
              notes: document.getElementById("bk-notes").value,
              preferred_language: lang,
              custom_answers: Object.keys(customAnswers).length ? customAnswers : undefined,
            }),
          });
          const result = await res.json();
          if (!res.ok) throw new Error(result.error || T().genericError);
          renderSuccess(result);
        } catch (err) {
          document.getElementById("book-error").textContent = err.message;
          document.getElementById("book-error").style.display = "block";
          btn.disabled = false;
          btn.textContent = T().confirmBtn;
        }
      });
    }

    function renderSuccess(result) {
      document.getElementById("book-content").innerHTML = `
        <div class="card" style="text-align:center;">
          <div class="book-success-check">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <h2 style="margin-top:0;">${T().confirmed}</h2>
          <p class="hint">${escapeHtml(result.date_label)}, ${escapeHtml(result.slot_label)}</p>
          <p class="hint" style="margin-top:0.8rem;">${T().confirmedNote}</p>
          <button type="button" class="secondary" id="book-again-btn" style="width:100%; margin-top:1.5rem;">${T().bookAgain}</button>
        </div>
      `;
      document.getElementById("book-again-btn").addEventListener("click", () => {
        selectedDate = null;
        selectedSlot = null;
        calendarViewMonth = null;
        // Same event type (if any) — re-fetch so the just-created booking is
        // correctly excluded/counted in the fresh slot list.
        loadAvailability(selectedType ? selectedType.id : undefined);
      });
    }

    loadAvailability();
  </script>
</body>
</html>
