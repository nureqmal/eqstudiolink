name = "eqstudio-link-reminder-cron"
main = "src/index.js"
compatibility_date = "2024-09-01"

# 1:00 UTC = 9:00 AM Malaysia time (UTC+8) — full daily sweep (reminders + billing +
# recurring + digest + appointment). A second, more frequent trigger (every 2 hours)
# runs ONLY the reminder sweep — it has its own dedup guard (reminders_log unique
# constraint) so repeated runs are safe, and this catches customers added AFTER the
# once-daily run with a due_date of today, instead of making them wait until tomorrow.
# Billing/recurring/digest are NOT run on the frequent trigger — digest in particular
# has no dedup guard and would re-send the same daily summary every 2 hours if it were.
[triggers]
crons = ["0 1 * * *", "0 */2 * * *"]

# NOTE: reminder sending processes customers directly in one invocation (no Queue).
# Fine for small-to-moderate volume on the Free plan. If reminder volume grows into
# the hundreds/day, Workers' per-invocation subrequest limit (50 free / 1000 paid)
# becomes a real constraint — revisit a queue-based fan-out then (Workers Paid plan
# required, Queues isn't on Free).

# Secrets (do NOT put real values here — set via `wrangler secret put <NAME>`):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   RESEND_API_KEY
#   RESEND_FROM_EMAIL        (e.g. "eqstudio.link <reminder@eqstudio.link>")
#   MANUAL_TRIGGER_KEY       (any random string, for manual test-triggering via curl)
#   BILLPLZ_API_KEY          (Billplz Settings > API Keys)
#   BILLPLZ_COLLECTION_ID    (the Billplz collection to bill into)
#   PUBLIC_SITE_URL          (Fasa 3 — e.g. https://eqstudio.link)
#   FOUNDER_NOTIFY_EMAIL     (optional but recommended — where sweep-failure alerts go)
