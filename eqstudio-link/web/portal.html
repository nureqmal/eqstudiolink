<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<link rel="icon" type="image/x-icon" href="/assets/logo/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/logo/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/assets/logo/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/logo/apple-touch-icon.png" />
<title>Status Bayaran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css?v=43" />
<script>
  (function () {
    var saved = localStorage.getItem("eqstudio_theme");
    if (saved === "dark") document.documentElement.setAttribute("data-theme", "dark");
  })();
</script>
</head>
<body>
  <div class="wrap-narrow">
    <p class="brand" style="text-align:center; margin-bottom:2rem;" id="biz-brand"><img src="/assets/logo/logo-64.png" alt="eqstudio.link" /></p>
    <div class="card" id="content">
      <p class="hint">Memuatkan...</p>
    </div>

    <div class="card portal-chat-card" id="portal-chat-card" style="display:none; margin-top:1rem;">
      <div class="section-title"><h2 style="margin:0; font-size:1rem;" id="portal-chat-title">Chat</h2></div>
      <div id="portal-chat-booking-card"></div>
      <div class="cw-messages" id="portal-chat-messages"><p class="hint">Memuatkan...</p></div>
      <div class="chat-faq-chips" id="portal-chat-faq-chips"></div>
      <form id="portal-chat-form" class="cw-send-row">
        <input type="text" id="portal-chat-input" placeholder="Taip mesej..." autocomplete="off" />
        <button type="submit" aria-label="Hantar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg></button>
      </form>
    </div>
  </div>

  <script>
    // Note: zh/ta are AI-generated translations — a native speaker should review before go-live.
    const PORTAL_I18N = {
      ms: { greet: (n) => `Salam ${n},`, sub: "Berikut status bayaran anda:", amount: "Jumlah", due: "Tarikh Due", status: "Status", payBtn: "Bayar Sekarang", waBtn: "Ada Soalan? WhatsApp Kami", bankLabel: "Atau bank transfer terus", qrLabel: "🇲🇾 Scan QR DuitNow", qrNote: "Serasi semua bank & e-wallet (TnG, Boost, GrabPay, dll)", questions: "Ada soalan?", ssm: "No. Pendaftaran", statusLabels: { belum_bayar: "Belum Bayar", reminder_dihantar: "Reminder Dihantar", dah_bayar: "Dah Bayar" } },
      en: { greet: (n) => `Hi ${n},`, sub: "Here's your payment status:", amount: "Amount", due: "Due Date", status: "Status", payBtn: "Pay Now", waBtn: "Questions? WhatsApp Us", bankLabel: "Or bank transfer directly", qrLabel: "🇲🇾 Scan DuitNow QR", qrNote: "Works with all banks & e-wallets (TnG, Boost, GrabPay, etc.)", questions: "Questions?", ssm: "Registration No.", statusLabels: { belum_bayar: "Unpaid", reminder_dihantar: "Reminder Sent", dah_bayar: "Paid" } },
      zh: { greet: (n) => `${n}，您好，`, sub: "以下是您的付款状态：", amount: "金额", due: "到期日", status: "状态", payBtn: "立即付款", waBtn: "有疑问？WhatsApp 联系我们", bankLabel: "或直接银行转账", qrLabel: "🇲🇾 扫描 DuitNow QR", qrNote: "适用于所有银行和电子钱包（TnG、Boost、GrabPay 等）", questions: "有疑问？", ssm: "注册号", statusLabels: { belum_bayar: "未付款", reminder_dihantar: "已发送提醒", dah_bayar: "已付款" } },
      ta: { greet: (n) => `வணக்கம் ${n},`, sub: "உங்கள் கட்டண நிலை இதோ:", amount: "தொகை", due: "தவணை தேதி", status: "நிலை", payBtn: "இப்போது செலுத்துங்கள்", waBtn: "கேள்விகளா? WhatsApp", bankLabel: "அல்லது நேரடி வங்கி பரிமாற்றம்", qrLabel: "🇲🇾 DuitNow QR ஸ்கேன்", qrNote: "அனைத்து வங்கிகள் & இ-வாலட்களுடன் இணக்கமானது", questions: "கேள்விகளா?", ssm: "பதிவு எண்", statusLabels: { belum_bayar: "செலுத்தப்படவில்லை", reminder_dihantar: "நினைவூட்டல் அனுப்பப்பட்டது", dah_bayar: "செலுத்தப்பட்டது" } },
    };

    const token = new URLSearchParams(location.search).get("token");
    const content = document.getElementById("content");

    async function load() {
      if (!token) {
        content.innerHTML = `<p class="error">Link tidak sah.</p>`;
        return;
      }
      try {
        const res = await fetch(`/api/customer-portal?token=${encodeURIComponent(token)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Ralat memuatkan.");

        if (data.business?.business_name) {
          document.getElementById("biz-brand").textContent = data.business.business_name;
        }

        const c = data.customer;
        const T = PORTAL_I18N[c.preferred_language] || PORTAL_I18N.ms;
        content.innerHTML = `
          <h2 style="margin-top:0;">${T.greet(escapeHtml(c.name))}</h2>
          <p class="hint">${T.sub}</p>
          <div class="row">
            <div><label>${T.amount}</label><p class="mono" style="font-size:1.3rem; margin:0;">RM ${Number(c.amount).toFixed(2)}</p></div>
            <div><label>${T.due}</label><p class="mono" style="font-size:1.3rem; margin:0;">${c.due_date}</p></div>
          </div>
          <label>${T.status}</label>
          <p style="margin:0 0 1rem;"><span class="badge ${c.status}">${T.statusLabels[c.status]}</span></p>
          ${c.notes ? `<p class="hint"><em>${escapeHtml(c.notes)}</em></p>` : ""}
          ${(data.business?.bank_name && data.business?.bank_account_number) || data.business?.qr_code_url ? `
            <div style="background:var(--paper); border:1px dashed var(--paper-line); border-radius:8px; padding:1rem; margin-top:1rem; text-align:center;">
              <p class="hint" style="text-transform:uppercase; font-size:0.7rem; margin:0 0 0.5rem; text-align:left;">${T.bankLabel}</p>
              ${data.business?.bank_name && data.business?.bank_account_number ? `
                <p style="margin:0; font-size:0.9rem; text-align:left;">${escapeHtml(data.business.bank_name)}${data.business.bank_account_holder ? " — " + escapeHtml(data.business.bank_account_holder) : ""}<br/>
                <strong class="mono">${escapeHtml(data.business.bank_account_number)}</strong></p>` : ""}
              ${data.business?.qr_code_url ? `
                <p class="hint" style="font-size:0.68rem; margin:${data.business.bank_name ? "0.9rem" : "0"} 0 0.4rem; text-transform:uppercase;">${T.qrLabel}</p>
                <img src="${escapeHtml(data.business.qr_code_url)}" alt="QR DuitNow" style="max-width:160px; display:block; margin:0 auto;" />
                <p class="hint" style="font-size:0.68rem; margin:0.4rem 0 0;">${T.qrNote}</p>` : ""}
            </div>` : ""}
          ${data.business?.contact_phone || data.business?.contact_email ? `
            <p class="hint" style="margin-top:1.5rem; padding-top:1rem; border-top:1px solid var(--paper-line);">
              ${T.questions} ${data.business.contact_phone ? "📞 " + escapeHtml(data.business.contact_phone) : ""}
              ${data.business.contact_email ? " ✉️ " + escapeHtml(data.business.contact_email) : ""}
            </p>` : ""}
          ${data.business?.ssm_number ? `<p class="hint" style="font-size:0.72rem;">${T.ssm}: ${escapeHtml(data.business.ssm_number)}</p>` : ""}
          <div class="pdpa-badge"><a href="/privacy-policy.html" style="color:inherit; text-decoration:none;">🔒 Data dilindungi PDPA</a></div>
        `;
        initChatWidget(data.business, c, T);
      } catch (err) {
        content.innerHTML = `<p class="error">${escapeHtml(err.message)}</p>`;
      }
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }

    function waLink(business, customer) {
      if (!business?.contact_phone) return null;
      const digits = business.contact_phone.replace(/[^0-9]/g, "");
      const withCountryCode = digits.startsWith("0") ? "60" + digits.slice(1) : digits;
      const msg = encodeURIComponent(`Salam, saya nak tanya pasal invois RM${Number(customer.amount).toFixed(2)} (${customer.name}).`);
      return `https://wa.me/${withCountryCode}?text=${msg}`;
    }

    // ── Chat widget (customer side) — polling every 3s, no direct Supabase
    // access (see migration_fasa51_chat.sql for why). Primary way to reach
    // the business; WhatsApp is kept as a small secondary alternative. ──
    let chatLastSeenTimestamp = null;

    function renderPortalChatBubble(m) {
      const isOwner = m.sender_type === "owner";
      return `
        <div class="cw-bubble-row ${isOwner ? "from-customer-view-owner" : "from-customer-view-self"}">
          <div class="cw-bubble">${escapeHtml(m.message_text)}</div>
          <div class="cw-bubble-time">${new Date(m.created_at).toLocaleString("ms-MY", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}</div>
        </div>`;
    }

    async function pollChatMessages(isFirstLoad) {
      if (!token) return;
      try {
        const url = `/api/chat-customer-poll?token=${encodeURIComponent(token)}` + (chatLastSeenTimestamp && !isFirstLoad ? `&since=${encodeURIComponent(chatLastSeenTimestamp)}` : "");
        const res = await fetch(url);
        const data = await res.json();
        if (!res.ok) return;
        const messagesEl = document.getElementById("portal-chat-messages");
        if (data.messages.length === 0) {
          if (isFirstLoad) messagesEl.innerHTML = `<p class="hint" style="text-align:center; padding:1rem;">Belum ada mesej. Mulakan perbualan!</p>`;
          return;
        }
        if (isFirstLoad || messagesEl.querySelector(".hint")) messagesEl.innerHTML = "";
        data.messages.forEach(m => messagesEl.insertAdjacentHTML("beforeend", renderPortalChatBubble(m)));
        messagesEl.scrollTop = messagesEl.scrollHeight;
        chatLastSeenTimestamp = data.messages[data.messages.length - 1].created_at;
      } catch { /* silent — next poll will retry */ }
    }

    // Fixed set of quick-tap questions for customers — same across every
    // business since these are about the PLATFORM's process, not business-
    // specific (owner-side answers ARE editable, via chat_faq_templates).
    const CUSTOMER_FAQ_QUESTIONS = [
      "Saya nak reschedule, macam mana?",
      "Saya nak batal booking",
      "Bila saya akan dapat reminder?",
      "Deposit saya belum nampak status update",
      "Berapa lama tempoh servis ni?",
    ];

    async function loadPortalBookingCard() {
      const cardEl = document.getElementById("portal-chat-booking-card");
      try {
        const res = await fetch(`/api/chat-customer-booking-detail?token=${encodeURIComponent(token)}`);
        const data = await res.json();
        if (!res.ok || !data.booking) { cardEl.innerHTML = ""; return; }
        const b = data.booking;
        const dateLabel = new Date(b.slot_datetime).toLocaleString("ms-MY", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
        const statusLabel = b.status === "cancelled" ? "Dibatalkan" : "Disahkan";
        cardEl.innerHTML = `
          <div class="chat-booking-card">
            <div class="chat-booking-card-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></div>
            <div class="chat-booking-card-info">
              <div class="chat-booking-card-title">Booking Terkini · ${statusLabel}</div>
              <div class="chat-booking-card-detail">${dateLabel} · ${b.duration_minutes} minit</div>
            </div>
          </div>`;
      } catch { cardEl.innerHTML = ""; }
    }

    function renderPortalFaqChips() {
      const chipsEl = document.getElementById("portal-chat-faq-chips");
      chipsEl.innerHTML = CUSTOMER_FAQ_QUESTIONS.map(q => `<button type="button" class="chat-faq-chip" data-faq-question="${escapeHtml(q)}">${escapeHtml(q)}</button>`).join("");
      chipsEl.querySelectorAll("[data-faq-question]").forEach(chip => {
        chip.addEventListener("click", () => {
          document.getElementById("portal-chat-input").value = chip.dataset.faqQuestion;
          document.getElementById("portal-chat-form").requestSubmit();
        });
      });
    }

    function initChatWidget(business, customer, T) {
      const chatCard = document.getElementById("portal-chat-card");
      chatCard.style.display = "block";
      document.getElementById("portal-chat-title").textContent = business?.business_name ? `Chat dengan ${business.business_name}` : "Chat";

      const wa = waLink(business, customer);
      if (wa) {
        chatCard.insertAdjacentHTML("beforeend", `<a href="${wa}" class="portal-chat-wa-alt">${T.waBtn}</a>`);
      }

      loadPortalBookingCard();
      renderPortalFaqChips();
      pollChatMessages(true);
      setInterval(() => pollChatMessages(false), 3000);
    }

    document.getElementById("portal-chat-form")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("portal-chat-input");
      const text = input.value.trim();
      if (!text || !token) return;
      input.value = "";
      input.disabled = true;
      try {
        const res = await fetch("/api/chat-customer-send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, message: text }),
        });
        if (res.ok) await pollChatMessages(false);
      } catch { /* ignore, customer can retry */ }
      input.disabled = false;
      input.focus();
    });

    load();
  </script>
</body>
</html>
