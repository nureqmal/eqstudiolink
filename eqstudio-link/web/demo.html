<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Demo Mode | eqstudio.link</title>
<link rel="icon" type="image/x-icon" href="/assets/logo/favicon.ico" />
<link rel="stylesheet" href="/assets/style.css?v=18" />
</head>
<body>
  <div class="lp-nav">
    <a href="/" class="brand"><img src="/assets/logo/logo-64.png" alt="eqstudio.link" style="height:28px;" /></a>
  </div>

  <div style="max-width:720px; margin:3rem auto; padding:0 1.5rem;">
    <h1 style="margin-bottom:0.3rem;">Demo Mode</h1>
    <p class="hint" style="margin-bottom:2rem;">Halaman peribadi untuk buat video/screenshot promosi. Setiap kad bawa anda ke dashboard yang sudah lengkap diisi dengan data contoh, tiada Supabase disentuh langsung.</p>

    <div id="demo-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:1rem;"></div>
  </div>

  <script type="module">
    const NICHES = [
      {
        slug: "fotografi",
        label: "Lensa Kreatif Studio",
        desc: "Fotografi potret, pra-perkahwinan & liputan majlis",
        icon: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--stamp);"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>'
      },
      {
        slug: "aiskrim",
        label: "Aiskrim Comel",
        desc: "Katering aiskrim untuk event sekolah, kenduri & majlis",
        icon: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--stamp);"><path d="m7 11 5 11 5-11Z"></path><circle cx="12" cy="6" r="4"></circle></svg>'
      }
    ];

    document.getElementById("demo-grid").innerHTML = NICHES.map(n => `
      <a href="/dashboard.html?demo=${n.slug}" class="card" style="text-decoration:none; color:inherit; display:block; transition:transform 0.15s ease;">
        <div style="margin-bottom:0.6rem;">${n.icon}</div>
        <strong style="font-size:1.05rem;">${n.label}</strong>
        <p class="hint" style="margin:0.35rem 0 0; font-size:0.85rem;">${n.desc}</p>
      </a>
    `).join("");
  </script>
</body>
</html>
