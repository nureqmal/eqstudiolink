<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<link rel="icon" type="image/x-icon" href="/assets/logo/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/logo/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/assets/logo/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/logo/apple-touch-icon.png" />
<title>Akaun Digantung — eqstudio.link</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css?v=13" />
<script>
  (function () {
    var saved = localStorage.getItem("eqstudio_theme");
    if (saved === "dark") document.documentElement.setAttribute("data-theme", "dark");
  })();
</script>
</head>
<body>
  <div class="wrap-narrow" style="text-align:center; padding-top:5rem;">
    <div style="font-size:2.5rem; margin-bottom:1rem;">⏸️</div>
    <h1 style="font-size:1.6rem;">Akaun Digantung Sementara</h1>
    <p class="hint">Akaun anda telah digantung buat masa ini. Sila hubungi support eqstudio.link untuk maklumat lanjut.</p>
    <button class="secondary" id="logout-btn" style="margin-top:1rem;">Log Keluar</button>
  </div>

  <script type="module">
    import { supabase } from "/assets/supabase-client.js";
    document.getElementById("logout-btn").addEventListener("click", async () => {
      await supabase.auth.signOut();
      window.location.href = "/login.html";
    });
  </script>
</body>
</html>
