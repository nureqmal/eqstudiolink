<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/x-icon" href="/assets/logo/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/logo/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/assets/logo/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/logo/apple-touch-icon.png" />
<title>Forum — eqstudio.link</title>
<meta name="description" content="Diskusi, soalan, dan pengumuman untuk komuniti eqstudio.link." />
<link rel="canonical" href="https://eqstudio.link/forum.html" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css?v=7" />
<script>
  (function () {
    var saved = localStorage.getItem("eqstudio_theme");
    if (saved === "dark") document.documentElement.setAttribute("data-theme", "dark");
  })();
</script>
</head>
<body>

  <nav class="lp-nav">
    <a href="/" class="brand" style="text-decoration:none;"><img src="/assets/logo/logo-64.png" alt="eqstudio.link" /></a>
    <div class="lp-nav-links">
      <div class="lang-toggle">
        <button type="button" class="lang-toggle-btn active" data-lang-toggle="en">EN</button>
        <button type="button" class="lang-toggle-btn" data-lang-toggle="ms">BM</button>
      </div>
      <a href="/roadmap.html" class="plain">Roadmap</a>
      <a href="/login.html" class="plain" data-i18n="nav_login">Log In</a>
      <a href="/login.html" class="btn" data-i18n="nav_cta">Start Free</a>
    </div>
  </nav>

  <div class="wrap" style="padding-top:2rem; padding-bottom:4rem; max-width:760px;">
    <div id="forum-content">
      <div class="sim-spinner-wrap"><div class="sim-spinner"></div><p class="hint">Memuatkan...</p></div>
    </div>
  </div>

  <script type="module">
    import { supabase } from "/assets/supabase-client.js";
    import { applyLanguage, getCurrentLang, UI_STRINGS } from "/assets/i18n-ui.js";
    function t(key) { return UI_STRINGS[getCurrentLang()]?.[key] ?? key; }

    let currentUser = null;
    let canPost = false;
    let currentBusinessName = "";
    let allThreads = [];
    let allCategories = [];
    let activeCategorySlug = "all";
    let searchQuery = "";

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str ?? "";
      return div.innerHTML;
    }
    function featureStatusBadge(status) {
      if (status === "planned") return `<span class="badge pending" style="margin-right:0.4rem;">Planned</span>`;
      if (status === "in_progress") return `<span class="badge" style="margin-right:0.4rem; background:var(--stamp-soft); color:var(--stamp);">In Progress</span>`;
      if (status === "shipped") return `<span class="badge dah_bayar" style="margin-right:0.4rem;">Shipped</span>`;
      return "";
    }
    function fmtDate(iso) {
      return new Date(iso).toLocaleString("ms-MY", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
    }
    function fmtDateShort(iso) {
      return new Date(iso).toLocaleDateString("ms-MY", { day: "numeric", month: "short" });
    }

    async function checkAuth() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) { currentUser = null; canPost = false; return; }
      currentUser = session.user;
      const { data: profile } = await supabase.from("profiles").select("subscription_status, business_name").eq("id", currentUser.id).single();
      canPost = profile?.subscription_status === "active";
      currentBusinessName = profile?.business_name?.trim() || "";
    }

    function notice() {
      if (currentUser && canPost) return "";
      if (currentUser && !canPost) return `<p class="hint" style="text-align:center; padding:0.8rem; background:var(--pending-bg); border-radius:8px;">${t("forum_subscribe_needed")}</p>`;
      return `<p class="hint" style="text-align:center; padding:0.8rem; background:var(--paper); border-radius:8px;">${t("forum_login_needed")}</p>`;
    }

    // ── Unified feed (default landing) — search + category tabs, HivePress-style ──
    async function renderFeed() {
      const content = document.getElementById("forum-content");
      content.innerHTML = `<div class="sim-spinner-wrap"><div class="sim-spinner"></div><p class="hint">Memuatkan...</p></div>`;

      const res = await fetch("/api/forum-all-threads");
      const data = await res.json();
      if (!res.ok) { content.innerHTML = `<p class="error">${escapeHtml(data.error)}</p>`; return; }
      allThreads = data.threads;
      allCategories = data.categories;

      content.innerHTML = `
        <div style="text-align:center; margin-bottom:1.5rem;">
          <span class="lp-eyebrow">Forum</span>
          <h1 style="font-size:1.8rem; margin:0.4rem 0;">${t("forum_hero_title")}</h1>
          <p class="hint">${t("forum_hero_sub")}</p>
        </div>

        <input type="search" id="forum-search" data-i18n-placeholder="forum_search_placeholder" placeholder="Search threads..." style="margin-bottom:0.8rem;" />

        <div class="chip-row" id="forum-category-tabs" style="margin-bottom:1rem;"></div>

        ${canPost ? `
          <div class="card" style="margin-bottom:1rem;">
            <button type="button" class="btn" id="new-thread-toggle" data-i18n="forum_new_thread_btn" style="width:100%;">+ Start New Thread</button>
            <form id="new-thread-form" style="display:none; margin-top:1rem;">
              <label for="nt-category">Kategori</label>
              <select id="nt-category">${allCategories.filter(c => !c.founder_only).map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("")}</select>
              <label for="nt-title">${t("forum_title_label")}</label>
              <input type="text" id="nt-title" required />
              <label for="nt-message">${t("forum_message_label")}</label>
              <textarea id="nt-message" rows="4" required></textarea>
              <label style="margin-top:0.6rem;">Post sebagai</label>
              <div style="display:flex; gap:1rem; margin:0.3rem 0 0.2rem;">
                <label style="display:flex; align-items:center; gap:0.4rem; font-weight:400; cursor:pointer;"><input type="radio" name="nt-identity" value="business" checked style="width:auto;" /> ${escapeHtml(currentBusinessName || "Business Owner")}</label>
                <label style="display:flex; align-items:center; gap:0.4rem; font-weight:400; cursor:pointer;"><input type="radio" name="nt-identity" value="anonymous" style="width:auto;" /> Anonymous</label>
              </div>
              <button type="submit" style="margin-top:1rem;">Hantar</button>
              <p class="error" id="nt-error" style="display:none;"></p>
            </form>
          </div>` : notice()}

        <div class="card" id="forum-thread-feed"></div>
      `;

      renderCategoryTabs();
      renderFilteredThreads();

      document.getElementById("forum-search").addEventListener("input", (e) => {
        searchQuery = e.target.value.trim().toLowerCase();
        renderFilteredThreads();
      });

      const toggleBtn = document.getElementById("new-thread-toggle");
      if (toggleBtn) {
        toggleBtn.addEventListener("click", () => {
          const form = document.getElementById("new-thread-form");
          form.style.display = form.style.display === "none" ? "block" : "none";
        });
        document.getElementById("new-thread-form").addEventListener("submit", async (e) => {
          e.preventDefault();
          const errorEl = document.getElementById("nt-error");
          errorEl.style.display = "none";
          const identityChoice = document.querySelector('input[name="nt-identity"]:checked')?.value;
          const authorName = identityChoice === "anonymous" ? "Anonymous" : (currentBusinessName || "Business Owner");
          const { error } = await supabase.from("forum_threads").insert({
            category_id: document.getElementById("nt-category").value,
            owner_id: currentUser.id,
            author_name: authorName,
            title: document.getElementById("nt-title").value.trim(),
            message: document.getElementById("nt-message").value.trim(),
          });
          if (error) { errorEl.textContent = error.message; errorEl.style.display = "block"; return; }
          renderFeed();
        });
      }
    }

    function renderCategoryTabs() {
      const tabsEl = document.getElementById("forum-category-tabs");
      const tabs = [{ slug: "all", name: getCurrentLang() === "ms" ? "Semua" : "All" }, ...allCategories.map(c => ({ slug: c.slug, name: c.name }))];
      tabsEl.innerHTML = tabs.map(t => `
        <button type="button" class="chip ${t.slug === activeCategorySlug ? "selected" : ""}" data-cat-slug="${t.slug}">${escapeHtml(t.name)}</button>
      `).join("");
      tabsEl.querySelectorAll("[data-cat-slug]").forEach(btn => {
        btn.addEventListener("click", () => {
          activeCategorySlug = btn.dataset.catSlug;
          renderCategoryTabs();
          renderFilteredThreads();
        });
      });
    }

    function renderFilteredThreads() {
      const feedEl = document.getElementById("forum-thread-feed");
      let filtered = allThreads;
      if (activeCategorySlug !== "all") filtered = filtered.filter(t => t.category_slug === activeCategorySlug);
      if (searchQuery) filtered = filtered.filter(t => t.title.toLowerCase().includes(searchQuery) || t.message.toLowerCase().includes(searchQuery));

      if (filtered.length === 0) {
        feedEl.innerHTML = `<p class="hint" style="text-align:center;">${searchQuery ? t("forum_no_threads_search") : t("forum_no_threads_category")}</p>`;
        return;
      }

      feedEl.innerHTML = filtered.map((th, i) => `
        <a href="?thread=${th.id}" class="fade-in-row" style="animation-delay:${Math.min(i * 0.04, 0.4)}s; display:block; text-decoration:none; color:inherit; padding:0.9rem 0; border-bottom:1px solid var(--paper-line);">
          <div style="display:flex; justify-content:space-between; gap:0.8rem; align-items:flex-start;">
            <div style="min-width:0;">
              ${th.is_pinned ? `<span class="badge dah_bayar" style="margin-right:0.4rem;">Pinned</span>` : ""}
              ${th.is_founder ? `<span class="badge belum_bayar" style="margin-right:0.4rem;">Team</span>` : ""}${th.author_tier === "pro" ? `<span class="badge dah_bayar" style="margin-right:0.4rem;">Pro</span>` : ""}${featureStatusBadge(th.feature_status)}
              <span class="hint" style="font-size:0.72rem; text-transform:uppercase; letter-spacing:0.03em;">${escapeHtml(th.category_name || "")}</span>
              <div><strong>${escapeHtml(th.title)}</strong></div>
              <div class="hint" style="font-size:0.83rem; margin-top:0.2rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(th.message.length > 110 ? th.message.slice(0, 110) + "…" : th.message)}</div>
              <div class="hint" style="font-size:0.8rem; margin-top:0.2rem;">oleh ${escapeHtml(th.author_name)} · ${fmtDateShort(th.created_at)}</div>
            </div>
            <span class="hint" style="flex-shrink:0; font-size:0.8rem; text-align:right;">${th.reply_count} ${t("forum_replies_suffix")}${th.reaction_count > 0 ? `<br>♥ ${th.reaction_count}` : ""}</span>
          </div>
        </a>
      `).join("");
    }

    // ── View: single thread + replies ──
    async function renderThreadDetail(id) {
      const content = document.getElementById("forum-content");
      content.innerHTML = `<div class="sim-spinner-wrap"><div class="sim-spinner"></div><p class="hint">Memuatkan...</p></div>`;
      const res = await fetch(`/api/forum-thread-detail?id=${id}`);
      const data = await res.json();
      if (!res.ok) { content.innerHTML = `<p class="error">${escapeHtml(data.error)}</p>`; return; }

      content.innerHTML = `
        <a href="/forum.html" class="legal-back" style="text-decoration:none; color:var(--stamp); font-weight:600; font-size:0.85rem;">← Semua Thread</a>
        <div class="card" style="margin:1rem 0;">
          ${data.thread.is_pinned ? `<span class="badge dah_bayar" style="margin-right:0.4rem;">Pinned</span>` : ""}
          ${data.thread.is_founder ? `<span class="badge belum_bayar" style="margin-right:0.4rem;">Team</span>` : ""}${data.thread.author_tier === "pro" ? `<span class="badge dah_bayar" style="margin-right:0.4rem;">Pro</span>` : ""}${featureStatusBadge(data.thread.feature_status)}
          <h1 style="font-size:1.4rem; margin:0.5rem 0 0.2rem;">${escapeHtml(data.thread.title)}</h1>
          <p class="hint" style="margin-bottom:0.8rem;">oleh <strong>${escapeHtml(data.thread.author_name)}</strong> · ${fmtDate(data.thread.created_at)}</p>
          <p style="white-space:pre-wrap; line-height:1.7;">${escapeHtml(data.thread.message)}</p>
          <div style="margin-top:1rem; padding-top:0.8rem; border-top:1px solid var(--paper-line);">
            <button type="button" class="secondary" id="reaction-btn" ${!canPost ? "disabled" : ""} style="font-size:0.85rem;">
              ${currentUser && data.reactor_ids?.includes(currentUser.id) ? "♥" : "♡"} ${t("forum_appreciate")}${data.reaction_count > 0 ? ` (${data.reaction_count})` : ""}
            </button>
          </div>
        </div>

        <div id="replies-list">
          ${data.replies.map((r, i) => `
            <div class="card fade-in-row" style="animation-delay:${Math.min(i * 0.04, 0.4)}s; margin-bottom:0.8rem;">
              ${r.is_founder ? `<span class="badge belum_bayar" style="margin-bottom:0.4rem; display:inline-block;">Team</span>` : ""}${r.author_tier === "pro" ? `<span class="badge dah_bayar" style="margin-bottom:0.4rem; display:inline-block;">Pro</span>` : ""}
              <p class="hint" style="margin:0 0 0.4rem;"><strong>${escapeHtml(r.author_name)}</strong> · ${fmtDate(r.created_at)}</p>
              <p style="white-space:pre-wrap; line-height:1.6; margin:0;">${escapeHtml(r.message)}</p>
            </div>
          `).join("")}
        </div>

        ${notice()}
        ${canPost ? `
          <div class="card" style="margin-top:1rem;">
            <form id="reply-form">
              <label for="reply-message">${t("forum_your_reply_label")}</label>
              <textarea id="reply-message" rows="3" required></textarea>
              <label style="margin-top:0.6rem;">Post sebagai</label>
              <div style="display:flex; gap:1rem; margin:0.3rem 0 0.2rem;">
                <label style="display:flex; align-items:center; gap:0.4rem; font-weight:400; cursor:pointer;"><input type="radio" name="reply-identity" value="business" checked style="width:auto;" /> ${escapeHtml(currentBusinessName || "Business Owner")}</label>
                <label style="display:flex; align-items:center; gap:0.4rem; font-weight:400; cursor:pointer;"><input type="radio" name="reply-identity" value="anonymous" style="width:auto;" /> Anonymous</label>
              </div>
              <button type="submit" style="margin-top:0.8rem;">${t("forum_submit_reply_btn")}</button>
              <p class="error" id="reply-error" style="display:none;"></p>
            </form>
          </div>` : ""}
      `;

      document.getElementById("reaction-btn")?.addEventListener("click", async () => {
        if (!canPost) return;
        const alreadyReacted = data.reactor_ids?.includes(currentUser.id);
        if (alreadyReacted) {
          await supabase.from("forum_reactions").delete().eq("thread_id", id).eq("owner_id", currentUser.id);
        } else {
          await supabase.from("forum_reactions").insert({ thread_id: id, owner_id: currentUser.id });
        }
        renderThreadDetail(id);
      });

      const replyForm = document.getElementById("reply-form");
      if (replyForm) {
        replyForm.addEventListener("submit", async (e) => {
          e.preventDefault();
          const errorEl = document.getElementById("reply-error");
          errorEl.style.display = "none";
          const replyIdentity = document.querySelector('input[name="reply-identity"]:checked')?.value;
          const replyAuthorName = replyIdentity === "anonymous" ? "Anonymous" : (currentBusinessName || "Business Owner");
          const { error } = await supabase.from("forum_replies").insert({
            thread_id: id,
            owner_id: currentUser.id,
            author_name: replyAuthorName,
            message: document.getElementById("reply-message").value.trim(),
          });
          if (error) { errorEl.textContent = error.message; errorEl.style.display = "block"; return; }
          await supabase.from("forum_threads").update({ last_activity_at: new Date().toISOString() }).eq("id", id);

          const threadOwnerId = data.thread.owner_id;
          if (threadOwnerId && threadOwnerId !== currentUser.id) {
            await supabase.from("notifications").insert({
              owner_id: threadOwnerId,
              type: "forum_reply",
              title: "Ada balasan baharu untuk thread anda",
              message: `${replyAuthorName} balas: "${data.thread.title}"`,
              link_url: `/forum.html?thread=${id}`,
            }).then(() => {}, () => {}); // best-effort — reply itself already succeeded regardless
          }

          renderThreadDetail(id);
        });
      }
    }

    async function router() {
      await checkAuth();
      const params = new URLSearchParams(location.search);
      if (params.get("thread")) renderThreadDetail(params.get("thread"));
      else renderFeed();
    }

    applyLanguage(getCurrentLang());
    document.querySelectorAll("[data-lang-toggle]").forEach(btn => {
      btn.addEventListener("click", () => {
        applyLanguage(btn.dataset.langToggle);
        router();
      });
    });

    router();
  </script>
</body>
</html>
