<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin — eqstudio.link</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <div class="topbar">
    <span class="brand">eqstudio<span class="dot">.</span>link <span class="hint" style="font-family:var(--font-body); font-weight:500;">/ admin</span></span>
  </div>

  <div class="wrap">
    <div class="card" id="gate-card">
      <h2 style="margin-top:0;">Admin Login</h2>
      <label for="admin-key">Admin Key</label>
      <input type="password" id="admin-key" />
      <button id="gate-btn" style="margin-top:1rem;">Masuk</button>
      <p class="error" id="gate-error" style="display:none;"></p>
    </div>

    <div id="stats-wrap" style="display:none;">
      <div class="card">
        <div class="row" style="text-align:center;">
          <div class="stat"><div class="num" id="stat-users">–</div><div class="label">Jumlah Business Owner</div></div>
          <div class="stat"><div class="num" id="stat-customers">–</div><div class="label">Customer Ditrack</div></div>
          <div class="stat"><div class="num" id="stat-reminders">–</div><div class="label">Reminder Dihantar</div></div>
          <div class="stat"><div class="num" id="stat-paid">–</div><div class="label">Dah Bayar</div></div>
        </div>
        <p class="hint" style="text-align:center; margin-top:1.5rem;" id="checked-at"></p>
      </div>
    </div>
  </div>

  <script>
    const gateBtn = document.getElementById("gate-btn");
    const gateError = document.getElementById("gate-error");

    async function loadStats(key) {
      gateError.style.display = "none";
      const res = await fetch("/api/admin-stats", { headers: { "x-admin-key": key } });
      if (!res.ok) {
        gateError.textContent = "Admin key salah.";
        gateError.style.display = "block";
        return;
      }
      const data = await res.json();
      document.getElementById("stat-users").textContent = data.total_users ?? "–";
      document.getElementById("stat-customers").textContent = data.total_customers_tracked ?? "–";
      document.getElementById("stat-reminders").textContent = data.total_reminders_sent ?? "–";
      document.getElementById("stat-paid").textContent = data.total_paid ?? "–";
      document.getElementById("checked-at").textContent = "Dikemaskini: " + new Date(data.checked_at).toLocaleString("ms-MY");

      document.getElementById("gate-card").style.display = "none";
      document.getElementById("stats-wrap").style.display = "block";
      sessionStorage.setItem("eqstudio_admin_key", key);
    }

    gateBtn.addEventListener("click", () => {
      const key = document.getElementById("admin-key").value.trim();
      if (key) loadStats(key);
    });

    // Reuse key already entered this session, if any
    const savedKey = sessionStorage.getItem("eqstudio_admin_key");
    if (savedKey) loadStats(savedKey);
  </script>
</body>
</html>
