<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<link rel="icon" type="image/x-icon" href="/assets/logo/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/logo/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/assets/logo/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/logo/apple-touch-icon.png" />
<title>eqstudio.link — Masuk / Daftar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css?v=10" />
<script>
  (function () {
    var saved = localStorage.getItem("eqstudio_theme");
    if (saved === "dark") document.documentElement.setAttribute("data-theme", "dark");
  })();
</script>
</head>
<body>
  <div class="wrap-narrow">
    <div class="login-hero-mark">
      <span class="lp-eyebrow">Automasi Reminder Bayaran</span>
      <p class="brand" style="text-align:center; margin:0.6rem 0 0;"><img src="/assets/logo/logo-64.png" alt="eqstudio.link" /></p>
    </div>

    <div class="card login-card">
      <h2 id="form-title" style="margin-top:0;">Log Masuk</h2>
      <p class="hint" id="form-sub">Belum ada akaun? <a href="#" data-toggle>Daftar percuma</a></p>

      <form id="auth-form">
        <label for="email">Emel</label>
        <input type="email" id="email" required autocomplete="email" />

        <label for="password">Kata Laluan</label>
        <input type="password" id="password" required autocomplete="current-password" minlength="6" />

        <div id="signup-fields" style="display:none;">
          <label for="business_name">Nama Perniagaan</label>
          <input type="text" id="business_name" placeholder="cth: Kek Rumah Kak Yong" />
        </div>

        <button type="submit" id="submit-btn" style="width:100%; margin-top:1.25rem;">Log Masuk</button>
        <p class="error" id="error-msg" style="display:none;"></p>
        <p class="hint" id="success-msg" style="display:none; color:var(--ok);"></p>
      </form>
    </div>

    <div class="login-trust-row">
      <span><a href="/privacy-policy.html" style="color:inherit; text-decoration:none;">🔒 PDPA Compliant</a></span>
      <span>⚡ Automatik penuh</span>
      <span>💳 Tiada kad kredit</span>
    </div>
  </div>

  <script type="module">
    import { supabase } from "/assets/supabase-client.js";

    const form = document.getElementById("auth-form");
    const signupFields = document.getElementById("signup-fields");
    const title = document.getElementById("form-title");
    const sub = document.getElementById("form-sub");
    const submitBtn = document.getElementById("submit-btn");
    const errorMsg = document.getElementById("error-msg");
    const successMsg = document.getElementById("success-msg");

    let mode = "login"; // or "signup"

    // Kalau dah login, terus ke dashboard
    supabase.auth.getSession().then(({ data }) => {
      if (data.session) window.location.href = "/dashboard.html";
    });

    function setMode(newMode) {
      mode = newMode;
      const isSignup = mode === "signup";
      title.textContent = isSignup ? "Daftar Akaun" : "Log Masuk";
      submitBtn.textContent = isSignup ? "Daftar" : "Log Masuk";
      signupFields.style.display = isSignup ? "block" : "none";
      sub.innerHTML = isSignup
        ? 'Dah ada akaun? <a href="#" data-toggle>Log masuk</a>'
        : 'Belum ada akaun? <a href="#" data-toggle>Daftar percuma</a>';
      errorMsg.style.display = "none";
      successMsg.style.display = "none";
    }

    // Event delegation: works even after sub.innerHTML replaces the link
    sub.addEventListener("click", (e) => {
      if (e.target.matches("[data-toggle]")) {
        e.preventDefault();
        setMode(mode === "login" ? "signup" : "login");
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.style.display = "none";
      successMsg.style.display = "none";
      submitBtn.disabled = true;

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        if (mode === "signup") {
          const business_name = document.getElementById("business_name").value.trim();
          const { data, error } = await supabase.auth.signUp({ email, password, options: { emailRedirectTo: window.location.origin + "/login.html" } });
          if (error) throw error;
          if (data.user && business_name) {
            // profile row is auto-created by DB trigger; just fill in the name
            await supabase.from("profiles").update({ business_name }).eq("id", data.user.id);
          }
          if (data.session) {
            window.location.href = "/dashboard.html";
          } else {
            successMsg.textContent = "Daftar berjaya! Sila semak emel untuk sahkan akaun, kemudian log masuk.";
            successMsg.style.display = "block";
          }
        } else {
          const { error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) throw error;
          window.location.href = "/dashboard.html";
        }
      } catch (err) {
        errorMsg.textContent = err.message || "Ada masalah. Cuba lagi.";
        errorMsg.style.display = "block";
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
